<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Страница не&nbsp;найдена · Goulash.tech</title>
  <meta name="description" content="По этому адресу страницы нет. Вернитесь на главную Goulash.tech.">
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <!-- Хостинг отдаёт эту страницу по любому неверному адресу, на любой глубине. Чтобы стили
       и скрипты находились, база ссылок — корень сайта: на GitHub Pages это /имя-репозитория/,
       на другом хостинге и на локальном сервере, запущенном из папки site/, это /. -->
  <script>
    (function () {
      if (location.protocol === 'file:') return;   // файл открыт с диска: относительные пути и так верны
      var parts = location.pathname.split('/');
      var base = /\.github\.io$/.test(location.hostname) && parts.length > 2 ? '/' + parts[1] + '/' : '/';
      var el = document.createElement('base');
      el.href = base;
      document.head.appendChild(el);
    })();
  </script>
